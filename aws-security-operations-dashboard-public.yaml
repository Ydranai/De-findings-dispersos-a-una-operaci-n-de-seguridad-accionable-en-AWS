                "title": "🟡 Access Keys — Usuario, edad y último uso",
                "view": "table",
                "query": "SOURCE '/aws/security/operations/iam'\n| fields @timestamp, user, access_key_id, key_status, key_age_days, age_bucket, last_used_at, unused_days, unused_bucket, last_used_service, last_used_region, mfa_active\n| filter record_type = 'IAM_KEY_DETAIL'\n| filter age_bucket like /__IAM_REGEX__/ or unused_bucket like /__IAM_REGEX__/\n| sort @timestamp desc\n| dedup access_key_id\n| limit 100"
              }
            },
            {
              "type": "log",
              "x": 0, "y": 65, "width": 24, "height": 7,
              "properties": {
                "region": "${AWS::Region}",
                "title": "🟠 Usuarios IAM — Acceso a consola y MFA",
                "view": "table",
                "query": "SOURCE '/aws/security/operations/iam'\n| fields @timestamp, user, password_enabled, mfa_active, mfa_status, password_last_used, user_created\n| filter record_type = 'IAM_USER_DETAIL'\n| sort @timestamp desc\n| dedup user\n| limit 100"
              }
            },
            {
              "type": "text",
              "x": 0, "y": 72, "width": 24, "height": 1,
              "properties": {
                "background": "solid",
                "markdown": "## 🟢 Operación del colector"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 73, "width": 12, "height": 5,
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "security-operations-collector", {"label": "Errors"}],
                  [".", "Throttles", ".", ".", {"label": "Throttles"}]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "title": "Lambda - Errors / Throttles"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 73, "width": 12, "height": 5,
              "properties": {
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "security-operations-collector", {"label": "Invocations"}],
                  [".", "Duration", ".", ".", {"label": "Duration ms", "stat": "Average", "yAxis": "right"}]
                ],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "title": "Lambda - Ejecuciones"
              }
            }
          ]
        }

Outputs:
  DashboardName:
    Description: CloudWatch dashboard name.
    Value: !Ref DashboardName

  DashboardUrl:
    Description: CloudWatch dashboard console URL.
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${DashboardName}

  LambdaFunctionName:
    Description: Metrics collector Lambda.
    Value: !Ref SecurityMetricsLambda

  LambdaRoleArn:
    Description: Least-privilege Lambda role.
    Value: !GetAtt SecurityMetricsLambdaRole.Arn

  NotificationTopic:
    Description: SNS topic created by this stack for security notifications.
    Value: !Ref SecurityAlertsTopic

  MetricNamespaceOutput:
    Description: Custom CloudWatch namespace.
    Value: !Ref MetricNamespace

  ActiveFindingsInsightArn:
    Description: Security Hub Insight used for active finding severity counts.
    Value: !Ref ActiveFindingsBySeverityInsight

  GuardDutyInsightArn:
    Description: Security Hub Insight used for GuardDuty severity counts.
    Value: !Ref GuardDutyBySeverityInsight

  FailedControlsInsightArn:
    Description: Security Hub Insight used for failed controls.
    Value: !Ref FailedControlsBySeverityInsight

  OperationalFindingsSchedule:
    Description: EventBridge rule that refreshes operational finding details.
    Value: !Ref FindingsDetailScheduleRule

  OperationalFindingsLogGroupName:
    Description: Dedicated log group queried by finding-detail dashboard tables.
    Value: !Ref OperationalFindingsLogGroup

  IamOperationsLogGroupName:
    Description: Dedicated log group queried by IAM detail dashboard tables.
    Value: !Ref IamOperationsLogGroup
